<div class="love-days">
  <div class="love-days-heart">♥</div>
  <div class="love-days-num"><span id="love-days-count">--</span><span class="love-days-unit">天</span></div>
  <div class="love-days-clock" id="love-days-clock">-- 时 -- 分 -- 秒</div>
  <div class="love-days-sub">从 2021 年 11 月 14 日开始</div>
  <div class="love-days-ann" id="love-days-ann"></div>
</div>
<style>
.love-days{text-align:center;padding:30px 10px;}
.love-days-heart{font-size:44px;color:#e5484d;animation:loveBeat 1.6s ease-in-out infinite;}
@keyframes loveBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.love-days-num{font-size:64px;font-weight:700;line-height:1.2;background:linear-gradient(90deg,#f5c97b,#f7a8b8);-webkit-background-clip:text;background-clip:text;color:transparent;}
.love-days-unit{font-size:28px;margin-left:6px;}
.love-days-clock{font-size:20px;margin-top:6px;opacity:.75;font-variant-numeric:tabular-nums;}
.love-days-sub{margin-top:16px;opacity:.6;font-size:15px;}
.love-days-ann{margin-top:8px;color:#e5484d;font-size:16px;}
@media (max-width:600px){.love-days-num{font-size:48px;}}
</style>
<script>
(function(){
  var start = new Date(2021, 10, 14);
  var countEl = document.getElementById('love-days-count');
  var clockEl = document.getElementById('love-days-clock');
  var annEl = document.getElementById('love-days-ann');
  function pad(n){return (n<10?'0':'')+n;}
  function tick(){
    var now = new Date();
    var diff = now - start;
    if(diff < 0) diff = 0;
    var days = Math.floor(diff/86400000);
    var rem = diff % 86400000;
    var h = Math.floor(rem/3600000); rem = rem%3600000;
    var m = Math.floor(rem/60000); rem = rem%60000;
    var s = Math.floor(rem/1000);
    countEl.textContent = days;
    clockEl.textContent = pad(h)+' 时 '+pad(m)+' 分 '+pad(s)+' 秒';
    var y = now.getFullYear();
    var ann = new Date(y, 10, 14);
    if(ann < now) ann = new Date(y+1, 10, 14);
    var daysTo = Math.ceil((ann - now)/86400000);
    var years = ann.getFullYear() - 2021;
    annEl.textContent = '距离 '+years+' 周年还有 '+daysTo+' 天';
  }
  tick();
  setInterval(tick, 1000);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
main{font-family:"ZCOOL XiaoWei", serif;}
.love-days{background:rgba(255,255,255,.65);border:1px solid #fbcfe8;border-radius:24px;padding:28px 20px;box-shadow:0 8px 30px rgba(244,114,182,.18);}
.love-divider{display:flex;align-items:center;gap:12px;justify-content:center;margin:26px 0 8px;color:#f472b6;}
.love-divider::before,.love-divider::after{content:"";height:1px;width:70px;background:#fbcfe8;}
.love-ann{text-align:center;font-size:22px;letter-spacing:8px;color:#f472b6;margin:10px 0 4px;}
.love-ann .next{display:inline-block;animation:lovePulse 1.6s ease-in-out infinite;}
@keyframes lovePulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.35);opacity:1;}}
.love-sentence{text-align:center;font-size:20px;color:#831843;margin-top:6px;}
</style>
<div class="love-divider">♥</div>
<div class="love-ann">♥ ♥ ♥ ♥ <span class="next">♡</span></div>
<div class="love-sentence">从 2021 年 11 月 14 日开始的故事，还在继续。</div>
