<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
main{font-family:"ZCOOL XiaoWei", serif;}
.love-days{background:rgba(255,255,255,.65);border:1px solid #fbcfe8;border-radius:24px;padding:28px 20px;box-shadow:0 8px 30px rgba(244,114,182,.18);}
.love-divider{display:flex;align-items:center;gap:12px;justify-content:center;margin:26px 0 8px;color:#f472b6;}
.love-divider::before,.love-divider::after{content:"";height:1px;width:70px;background:#fbcfe8;}
.love-ann{text-align:center;font-size:22px;letter-spacing:8px;color:#f472b6;margin:10px 0 4px;}
.love-ann .next{display:inline-block;animation:lovePulse 1.6s ease-in-out infinite;}
@keyframes lovePulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.35);opacity:1;}}
.love-sentence{text-align:center;font-size:20px;color:#831843;margin-top:6px;}
</style>
<div class="love-divider">♥</div>
<div class="love-ann">♥ ♥ ♥ ♥ <span class="next">♡</span></div>
<div class="love-sentence">从 2021 年 11 月 14 日开始的故事，还在继续。</div>
