{{ if .IsHome }}
<div id="love-cover">
  <div class="love-cover-inner">
    <div class="love-cover-pill">♥ SINCE 2021.11.14</div>
    <div class="love-cover-bear">
      <img src="{{ "img/bear-heart.webp" | relURL }}" alt="抱着爱心的小熊">
    </div>
    <h1 class="love-cover-title">我们的故事</h1>
    <p class="love-cover-sub">从 2021 年 11 月 14 日开始的故事，还在继续。</p>
    <button class="love-cover-btn" id="love-enter-btn">进入我们的世界 →</button>
  </div>
  <div class="love-cover-hearts" id="love-cover-hearts"></div>
</div>
<style>
#love-cover{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at center,#3d1a20 0%,#2b1216 55%,#1c0b0e 100%);transition:opacity .8s ease;}
#love-cover.hide{opacity:0;pointer-events:none;}
.love-cover-inner{position:relative;z-index:2;text-align:center;padding:20px;}
.love-cover-pill{display:inline-block;padding:6px 16px;border:1px solid rgba(245,201,123,.5);border-radius:999px;color:#f5c97b;font-size:13px;letter-spacing:2px;}
.love-cover-bear{width:190px;height:190px;margin:28px auto 8px;background:#fff;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;animation:bearFloat 3.2s ease-in-out infinite;overflow:hidden;}
.love-cover-bear img{width:100%;height:100%;object-fit:contain;}
@keyframes bearFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.love-cover-title{margin:18px 0 8px;font-family:"Songti SC","Noto Serif SC",serif;font-size:52px;font-weight:700;background:linear-gradient(90deg,#f5c97b,#f7a8b8);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;}
.love-cover-sub{color:rgba(255,255,255,.75);font-size:16px;margin:0 0 30px;}
.love-cover-btn{border:none;cursor:pointer;padding:15px 38px;font-size:18px;border-radius:999px;color:#3a1f16;background:linear-gradient(90deg,#f5c97b,#f0a988);box-shadow:0 8px 30px rgba(245,201,123,.45);transition:transform .2s ease;}
.love-cover-btn:hover{transform:scale(1.05);}
.love-cover-hearts span{position:absolute;bottom:-20px;animation:heartUp linear forwards;pointer-events:none;}
@keyframes heartUp{to{transform:translateY(-105vh) rotate(20deg);opacity:0;}}
@media (max-width:600px){.love-cover-bear{width:150px;height:150px;}.love-cover-title{font-size:38px;}}
</style>
<script>
(function(){
  var cover=document.getElementById('love-cover');
  if(!cover){return;}
  if(sessionStorage.getItem('love-entered')){cover.remove();return;}
  document.body.style.overflow='hidden';
  var heartsBox=document.getElementById('love-cover-hearts');
  var hearts=['♥','♥','♥','✦'];
  var colors=['#f7a8b8','#f5c97b','#ff6b81','#ffd166'];
  var timer=setInterval(function(){
    if(!document.body.contains(cover)||cover.classList.contains('hide')){clearInterval(timer);return;}
    var s=document.createElement('span');
    s.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    s.style.left=Math.random()*100+'vw';
    s.style.fontSize=(14+Math.random()*18)+'px';
    s.style.color=colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDuration=(5+Math.random()*4)+'s';
    heartsBox.appendChild(s);
    setTimeout(function(){s.remove();},9000);
  },500);
  document.getElementById('love-enter-btn').addEventListener('click',function(){
    var bgm=document.getElementById('bgm');
    if(bgm){bgm.play().catch(function(){});}
    cover.classList.add('hide');
    document.body.style.overflow='';
    sessionStorage.setItem('love-entered','1');
    setTimeout(function(){cover.remove();},900);
  });
})();
</script>
{{ end }}
<div id="bgm-box">
  <iframe id="bgm-player" src="//player.bilibili.com/player.html?bvid=BV15x4y1s79w&page=1&autoplay=1&danmaku=0" scrolling="no" frameborder="no" allowfullscreen="true"></iframe>
</div>
<style>
#bgm-box{position:fixed;right:16px;bottom:16px;z-index:9000;width:240px;height:135px;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4);}
#bgm-box iframe{width:100%;height:100%;border:0;}
@media (max-width:600px){#bgm-box{width:180px;height:101px;}}
</style>
<script>
document.getElementById('love-enter-btn')?.addEventListener('click',function(){
  var p=document.getElementById('bgm-player');
  if(p){p.src=p.src;}
});
</script>
